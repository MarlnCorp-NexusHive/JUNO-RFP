name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Unit, Security & 60-User Load Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: juno-backend
        run: npm ci
      - name: Syntax check backend
        run: |
          for f in juno-backend/*.js juno-backend/*/*.js; do
            node --check "$f"
          done
      - name: Run backend test suite
        working-directory: juno-backend
        run: npm test

  frontend-ci:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint
      - name: Run Vitest unit tests
        run: npm test
      - name: Build unified production site
        run: npm run build:site
