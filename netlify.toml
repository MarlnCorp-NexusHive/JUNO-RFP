# junorfp.com — marketing website + JUNO RFP app on the SAME domain.
# Marketing: /  and /workspace/
# App SPA:   /login, /app/*, /rbac/*, …  → /r/index.html (Vite assets under /r/)

[build]
  command = "npm run build:site"
  publish = "_site"
  functions = "website/netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallbacks (do not catch marketing /, /workspace, or static assets)
[[redirects]]
  from = "/login"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/rbac/*"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/collaboration"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/collaboration/*"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/cookie-policy"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/corporate-info"
  to = "/r/index.html"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/r/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
