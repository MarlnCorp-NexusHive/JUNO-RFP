# Reference config for the JUNO RFP React app Netlify site (e.g. app.junorfp.com).
# Copy these Build settings in the Netlify UI for that site (do not use for junorfp.com).
#
# Build command: npm run build
# Publish directory: dist
# Functions: (none required for the SPA)
# Env: VITE_API_URL = https://your-api-host.example.com
#
# The Express API (juno-backend) must run separately (Railway, Render, Fly, EC2, etc.).

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
