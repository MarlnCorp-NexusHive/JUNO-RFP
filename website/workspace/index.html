<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juno Workspace: AI-powered project and grant management by JunoRFP.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F85B5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
<title>Juno Workspace</title>
<style>@font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/fonts/geist-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url(../assets/fonts/geist-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Geist';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/geist-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Geist';font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/geist-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/fonts/geist-mono-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;font-display:swap;src:url(../assets/fonts/geist-mono-latin-500-normal.woff2) format('woff2')}</style>
<style>
/* Layout: forest sidebar + light work canvas; one segmented switch flips the same task data between Board, Table, Calendar and Timeline. Lime marks the one primary action. */
:root{
  --bg:#F7FAFD; --panel:#FFFFFF; --paper:#FBFDFF; --line:#DCE5EF; --line-2:#EBF1F7; --hover:#F0F6FC;
  --ink:#243F5B; --ink-2:#475569; --muted:#5F6F84; --faint:#8797AB;
  --side:#EAF2FA; --on-side:#243F5B; --on-side-2:#5E7690; --side-line:#D3E1EE; --side-hover:rgba(79,133,181,.10); --side-on:#DCEAF7;
  --forest:#243F5B; --forest-2:#33526F; --on-forest:#FFFFFF; --on-forest-2:#B9CCDF;
  --pine:#4F85B5; --pine-2:#3D6F9C; --lime:#8EC1EC; --lime-2:#DCEAF7; --lime-3:#EEF5FC;
  --grad:#4F85B5; --sec:#DCEAF7; --sec-h:#CDE0F2; --c-2:#F6AD55;
  --s-backlog:#94A3B8; --s-todo:#3B82F6; --s-doing:#F59E0B; --s-review:#8B5CF6; --s-done:#10B981;
  --p-urgent:#E5484D; --p-high:#F97316; --p-med:#3B82F6; --p-low:#94A3B8;
  --l-vac:#3B82F6; --l-ooo:#8B5CF6; --l-sick:#EC4899; --l-leave:#F59E0B; --l-trn:#14B8A6;
  --warn:#9A5B00; --warn-bg:#FEF3DC; --crit:#C42B35; --crit-bg:#FDE8EA; --ok:#0A7A55; --ok-bg:#DFF7EC; --info:#2F6BA8; --info-bg:#E3EFFA;
  --shadow:0 1px 2px rgba(36,63,91,.05),0 6px 20px rgba(36,63,91,.06);
  --shadow-lg:0 24px 60px rgba(36,63,91,.2);
  --f:"Geist","Helvetica Neue",Arial,sans-serif; --fm:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1824; --panel:#152232; --paper:#122030; --line:#26384D; --line-2:#1C2C3F; --hover:#1B2B3E;
  --ink:#E6EEF7; --ink-2:#C3D0DE; --muted:#93A5B9; --faint:#71849A;
  --side:#101C2A; --on-side:#E6EEF7; --on-side-2:#93A5B9; --side-line:#22344A; --side-hover:rgba(142,193,236,.08); --side-on:#1F3550;
  --forest:#2A4866; --forest-2:#365A7D; --on-forest:#FFFFFF; --on-forest-2:#B9CCDF;
  --pine:#8EC1EC; --pine-2:#A9D1F2; --lime:#8EC1EC; --lime-3:#172B42; --lime-2:#24405E;
  --grad:#4F85B5; --sec:#1F3550; --sec-h:#28425F; --c-2:#F6AD55;
  --s-backlog:#8A9AB0; --s-todo:#6EA8FF; --s-doing:#FBBF4C; --s-review:#A78BFA; --s-done:#34D399;
  --p-urgent:#FF7076; --p-high:#FB9A52; --p-med:#6EA8FF; --p-low:#8A9AB0;
  --l-vac:#6EA8FF; --l-ooo:#A78BFA; --l-sick:#F472B6; --l-leave:#FBBF4C; --l-trn:#2DD4BF;
  --warn:#FBBF4C; --warn-bg:#352812; --crit:#FF8A90; --crit-bg:#3D1A22; --ok:#5EE0B0; --ok-bg:#12302A; --info:#9DC4EE; --info-bg:#1A3049;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1824; --panel:#152232; --paper:#122030; --line:#26384D; --line-2:#1C2C3F; --hover:#1B2B3E;
  --ink:#E6EEF7; --ink-2:#C3D0DE; --muted:#93A5B9; --faint:#71849A;
  --side:#101C2A; --on-side:#E6EEF7; --on-side-2:#93A5B9; --side-line:#22344A; --side-hover:rgba(142,193,236,.08); --side-on:#1F3550;
  --forest:#2A4866; --forest-2:#365A7D; --on-forest:#FFFFFF; --on-forest-2:#B9CCDF;
  --pine:#8EC1EC; --pine-2:#A9D1F2; --lime:#8EC1EC; --lime-3:#172B42; --lime-2:#24405E;
  --grad:#4F85B5; --sec:#1F3550; --sec-h:#28425F; --c-2:#F6AD55;
  --s-backlog:#8A9AB0; --s-todo:#6EA8FF; --s-doing:#FBBF4C; --s-review:#A78BFA; --s-done:#34D399;
  --p-urgent:#FF7076; --p-high:#FB9A52; --p-med:#6EA8FF; --p-low:#8A9AB0;
  --l-vac:#6EA8FF; --l-ooo:#A78BFA; --l-sick:#F472B6; --l-leave:#FBBF4C; --l-trn:#2DD4BF;
  --warn:#FBBF4C; --warn-bg:#352812; --crit:#FF8A90; --crit-bg:#3D1A22; --ok:#5EE0B0; --ok-bg:#12302A; --info:#9DC4EE; --info-bg:#1A3049;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink-2);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--fm)}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;color:var(--ink);font-weight:600;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}

/* App shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr) auto;height:100%}
.side{background:var(--side);color:var(--on-side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
.brand svg{width:26px;height:26px;color:var(--pine)}
.brand b{color:var(--on-side)}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.03em}
.brand .tag{font:600 9px/1 var(--f);letter-spacing:.06em;background:var(--grad);color:#fff;padding:3px 5px;border-radius:4px}
.ws{margin:0 12px 12px;padding:9px 10px;border:1px solid var(--side-line);background:var(--panel);display:flex;align-items:center;gap:9px;border-radius:8px}
.ws .av{width:26px;height:26px;border-radius:6px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ws b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.ws b{color:var(--ink)}.ws span{font-size:11px;color:var(--on-side-2)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 8px;overflow-y:auto;flex:1}
.nav .lbl{font:500 10.5px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--on-side-2);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--on-side);padding:8px 10px;border-radius:7px;font-size:13.5px;min-height:36px}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-on);color:var(--on-side);font-weight:600}
.nav button svg{width:16px;height:16px;flex:none;opacity:.9}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav .cnt{margin-left:auto;font:500 11px/1 var(--fm);color:var(--on-side-2)}
.nav .cnt.hot{color:#fff;background:#E5484D;padding:3px 6px;border-radius:999px}
.side-foot{padding:12px 16px 16px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--on-side-2);padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.side-foot button{background:var(--panel);border:1px solid var(--side-line);color:var(--on-side);border-radius:7px;padding:7px 10px;font-size:12px;text-align:left}
.side-foot button:hover{border-color:var(--pine-2)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);min-height:58px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:0 10px;height:36px;min-width:240px;color:var(--faint);font-size:13px}
.cmdk:hover{border-color:var(--faint)}
.cmdk kbd{margin-left:auto;font:500 11px var(--fm);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--sec);background:var(--sec);color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--sec-h);background:var(--sec-h)}
.btn svg{width:15px;height:15px}
.btn.primary{background:#4F85B5;border-color:#4F85B5;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(79,133,181,.3)}
.btn.primary:hover{background:#3D6F9C;border-color:#3D6F9C}
.btn.dark{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}.btn.ai{color:var(--pine-2)!important;border-color:var(--pine)!important}
.btn.dark:hover{background:var(--forest-2)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.ai{border-color:var(--pine);color:var(--pine)}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:16px;height:16px}

.content{flex:1;min-height:0;overflow:auto;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}

/* Pills, avatars */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.np::before{display:none}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .crit{background:var(--crit-bg);color:var(--crit)} .info{background:var(--info-bg);color:var(--info)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font:600 10px/1 var(--f);flex:none}
.av.lg{width:30px;height:30px;font-size:11px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;padding:3px 9px 3px 7px;border-radius:999px;background:color-mix(in srgb,currentColor 13%,transparent)}
.col-h .st{padding:0;background:none}
.st i{width:9px;height:9px;border-radius:50%;flex:none;border:2px solid currentColor}
.st.done i{background:currentColor}
.st.doing i{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;white-space:nowrap}
.pri svg{width:12px;height:12px}
.chip{display:inline-flex;align-items:center;font:500 11px/1 var(--fm);padding:4px 6px;border-radius:5px;background:var(--lime-3);color:var(--pine);border:1px solid var(--lime-2);white-space:nowrap}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.sec-title{font-size:15px;font-weight:600}
.sub{color:var(--muted);font-size:13px}

/* Home */
.greet{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.greet h1{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi small{color:var(--muted);font-size:12px}
.kpi strong{color:var(--ink);font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.ins{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.ins:last-child{border-bottom:0}
.ins .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.ins .ic svg{width:16px;height:16px}
.ins b{font-weight:600;display:block;font-size:13.5px}
.ins p{color:var(--muted);font-size:12.5px;margin-top:2px}
.ins .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pulse{display:flex;flex-direction:column;gap:4px;min-width:150px}
.pulse div{display:grid;grid-template-columns:40px minmax(0,1fr) 34px;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.track{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.ptable{width:100%;border-collapse:collapse}
.ptable td,.ptable th{padding:11px 16px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
.ptable th{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ptable tr.click{cursor:pointer}
.ptable tr.click:hover td{background:var(--hover)}
.load{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:8px 16px;font-size:12.5px}
.load .bar{height:10px;background:var(--line-2);border-radius:5px;position:relative;overflow:hidden}
.load .bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.load .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2);opacity:.5}
@media (max-width:1100px){.home-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Project header */
.phead{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.phead h1{font-size:24px}
.phead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--muted);font-size:13px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:500;color:var(--muted);white-space:nowrap;min-height:40px}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--pine)}
.ptabs button:hover{color:var(--ink)}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:500;font-size:13px}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:6px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;min-width:200px}
.search svg{width:15px;height:15px;color:var(--faint)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.sel{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;font-size:13px}
.tb-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);height:36px;padding:0 4px}
.toggle input{accent-color:var(--pine);width:16px;height:16px}

/* Board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;min-height:420px}
.col{background:var(--line-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px;transition:background .12s,outline-color .12s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{background:var(--lime-3);outline-color:var(--pine)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-h b{font-size:13px;font-weight:600}
.col-h .n{font:500 11px var(--fm);color:var(--muted);background:var(--panel);border-radius:999px;padding:2px 7px}
.col-h .wip{margin-left:auto;font:500 10.5px var(--fm);color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 0 rgba(13,23,26,.03);transition:box-shadow .12s,transform .12s,border-color .12s}
.card:hover{border-color:var(--faint);box-shadow:var(--shadow)}
.card.dragging{opacity:.45;transform:rotate(1.5deg)}
.card .t{font-weight:500;line-height:1.35}
.card .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .row.sp{justify-content:space-between}
.due{font:500 11px/1 var(--fm);color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.due.late{color:var(--crit)}
.due.soon{color:var(--warn)}
.due svg{width:12px;height:12px}
.mini-prog{display:flex;align-items:center;gap:6px;font:500 11px var(--fm);color:var(--muted)}
.mini-prog .track{width:54px;height:4px}
.blocked{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--crit)}
.blocked svg{width:12px;height:12px}
.add-card{border:1px dashed var(--line);background:none;border-radius:9px;padding:8px;color:var(--muted);text-align:left;font-size:13px}
.add-card:hover{border-color:var(--pine);color:var(--pine)}
.add-input{border:1px solid var(--pine);border-radius:9px;padding:9px 10px;background:var(--panel);outline:0;width:100%}

/* Table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--paper);font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{background:none;border:0;padding:10px 10px;width:100%;text-align:left;color:inherit;display:flex;gap:4px;align-items:center;font-weight:500}
.tbl th button:hover{color:var(--ink)}
.tbl td{padding:4px 10px;border-bottom:1px solid var(--line-2);height:42px;vertical-align:middle;white-space:nowrap}
.tbl tr:hover td{background:var(--hover)}
.tbl tr.selr td{background:var(--lime-3)}
.tbl .grp td{background:var(--paper);height:36px;font-weight:600;font-size:12.5px;position:sticky;left:0}
.tbl .tt{background:none;border:0;padding:4px 0;font-weight:500;text-align:left;max-width:340px;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--ink)}
.tbl .tt:hover{color:var(--pine);text-decoration:underline}
.cell-sel{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 4px;height:30px;font-size:12.5px;max-width:150px}
.cell-sel:hover,.cell-sel:focus{border-color:var(--line);background:var(--panel)}
.cell-in{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;height:30px;font-size:12.5px;font-family:var(--fm)}
.cell-in:hover,.cell-in:focus{border-color:var(--line);background:var(--panel)}
.cell-in.num{width:64px}
.tbl input[type=checkbox]{accent-color:var(--pine);width:15px;height:15px}
.bulk{position:sticky;bottom:12px;margin:12px auto 0;display:flex;align-items:center;gap:10px;background:var(--forest);color:var(--on-forest);border-radius:12px;padding:8px 10px 8px 16px;box-shadow:var(--shadow-lg);width:max-content;max-width:100%;flex-wrap:wrap}
.bulk .sel{background:var(--forest-2);color:var(--on-forest);border-color:rgba(236,238,255,.2)}
.tfoot-add{display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--muted)}

/* Calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h h2{font-size:18px;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.cal .dow{background:var(--paper);padding:8px 10px;font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day{background:var(--panel);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:3px;margin-top:1px;transition:background .12s}
.cal .day:not(:nth-child(7n+1)){margin-left:1px}
.day.we{background:var(--paper)}
.day.out .dn{color:var(--faint);opacity:.6}
.day.over{background:var(--lime-3)}
.dn{font:500 12px var(--fm);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.day.today .dn span{background:var(--pine);color:var(--panel);border-radius:999px;padding:2px 7px}
.ev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 6px;border-radius:5px;background:var(--hover);border-left:3px solid var(--s-todo);cursor:grab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%;color:var(--ink)}
.ev:hover{filter:brightness(.97)}
.ev.ms{background:var(--forest);color:var(--on-forest);border-left-color:var(--lime);font-weight:600}
.more{font-size:11px;color:var(--muted);padding-left:6px;background:none;border:0;text-align:left}
@media (max-width:760px){.day{min-height:70px}.ev{font-size:0;padding:0;height:6px;border-left-width:0;background:var(--s-todo)}}

/* Gantt */
.gantt{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:300px minmax(0,1fr);max-height:calc(100vh - 290px);min-height:360px;overflow:auto;position:relative}
.g-left{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line)}
.g-head{height:52px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
.g-left .g-head{display:flex;align-items:flex-end;padding:0 12px 8px;font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;z-index:6}
.g-row{height:40px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;padding:0 12px}
.g-row button{background:none;border:0;text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0;flex:1;min-width:0;color:var(--ink)}
.g-row button:hover{color:var(--pine)}
.g-right{position:relative}
.g-months{display:flex;height:26px;border-bottom:1px solid var(--line-2)}
.g-months div{flex:none;font-size:11.5px;font-weight:600;padding:6px 8px;border-left:1px solid var(--line-2);white-space:nowrap;overflow:hidden}
.g-ticks{display:flex;height:26px}
.g-ticks div{flex:none;font:500 10px var(--fm);color:var(--faint);padding:7px 0 0 3px;border-left:1px solid var(--line-2);white-space:nowrap;overflow:hidden}
.g-body{position:relative}
.g-bg{position:absolute;top:0;bottom:0;background:var(--paper)}
.g-grow{height:40px;border-bottom:1px solid var(--line-2)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:2}
.g-today span{position:absolute;top:-1px;left:-18px;font:600 9.5px var(--fm);color:#fff;background:var(--crit);padding:2px 4px;border-radius:3px}
.gbar{position:absolute;height:24px;border-radius:6px;z-index:3;display:flex;align-items:center;overflow:hidden;cursor:grab;touch-action:none;box-shadow:0 1px 2px rgba(13,23,26,.12);user-select:none}
.gbar .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28)}
.gbar .lab{position:relative;font-size:11.5px;font-weight:600;color:#fff;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gbar .gh{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize;background:rgba(255,255,255,.25)}
.gbar.crit{outline:2px solid var(--crit);outline-offset:1px}
.gbar.conf{outline:2px dashed var(--crit);outline-offset:1px}
.gbar.dragging{cursor:grabbing;opacity:.85}
.gms{position:absolute;width:16px;height:16px;transform:rotate(45deg);z-index:3;background:var(--forest);border:2px solid var(--lime);cursor:grab;touch-action:none}
.g-out{position:absolute;font-size:11.5px;color:var(--muted);white-space:nowrap;pointer-events:none;z-index:3}
.g-deps{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(12,14,36,.32);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:61;box-shadow:var(--shadow-lg);transform:translateX(104%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.dr-title{width:100%;border:1px solid transparent;border-radius:8px;padding:6px 8px;margin-left:-8px;font-size:20px;font-weight:600;letter-spacing:-.015em;background:none}
.dr-title:hover,.dr-title:focus{border-color:var(--line);outline:0}
.fields{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:center}
.fields label{color:var(--muted);font-size:12.5px}
.fields .sel,.fields input{width:100%;max-width:260px}
.fields input{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px}
.subt{display:flex;flex-direction:column;gap:2px}
.subt label{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer}
.subt label:hover{background:var(--hover)}
.subt input{accent-color:var(--pine);width:16px;height:16px}
.subt .done span{text-decoration:line-through;color:var(--faint)}
.inline-add{display:flex;gap:8px}
.inline-add input,.inline-add textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);resize:vertical}
.cmt{display:flex;gap:10px}
.cmt .bub{background:var(--paper);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;flex:1;min-width:0}
.cmt .bub small{color:var(--faint);font-size:11px}
.dep-list{display:flex;flex-wrap:wrap;gap:6px}
.dep{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 6px 4px 8px;font-size:12.5px}
.dep button{background:none;border:0;color:var(--faint);padding:0 2px}
.ai-box{border:1px solid var(--lime-2);background:var(--lime-3);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* Copilot */
.copilot{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transition:width .22s ease}
.copilot.on{width:380px}
.cp-in{width:380px;display:flex;flex-direction:column;height:100%;padding-right:env(safe-area-inset-right,0px)}
.cp-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cp-h .orb{width:30px;height:30px;border-radius:9px;background:var(--forest);display:grid;place-items:center;color:var(--lime)}
.cp-h .orb svg{width:16px;height:16px}
.cp-msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--forest);color:var(--on-forest);padding:9px 12px;border-radius:12px 12px 2px 12px;max-width:88%}
.msg.a{background:var(--paper);border:1px solid var(--line-2);padding:10px 12px;border-radius:12px 12px 12px 2px}
.msg.sys{font-size:12px;color:var(--muted);text-align:center;white-space:normal}
.msg .tool{display:block;font:500 11px var(--fm);color:var(--pine);margin-top:6px}
.cp-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.cp-quick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 10px;font-size:12px}
.cp-quick button:hover{border-color:var(--pine);color:var(--pine)}
.cp-form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.cp-form textarea{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;resize:none;height:44px;background:var(--paper);outline:0}
.cp-form textarea:focus{border-color:var(--pine)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Palette, toast */
.pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(12,14,36,.36)}
.pal.on{display:flex}
.pal-box{width:min(620px,100%);background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--line)}
.pal-box input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;outline:0;background:none}
.pal-list{max-height:360px;overflow:auto;padding:6px}
.pal-list button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px}
.pal-list button.act,.pal-list button:hover{background:var(--hover)}
.pal-list small{margin-left:auto;color:var(--faint);font-size:11.5px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--forest);color:var(--on-forest);padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:all .2s;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Budget/obligations/report */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
.btab{width:100%;border-collapse:collapse}
.btab th,.btab td{padding:10px 14px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
.btab th{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btab td.r,.btab th.r{text-align:right}
.diag{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gate-step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px}
.rep p{font-size:14.5px;line-height:1.6}
.rep .para{padding:12px 0;border-bottom:1px solid var(--line-2)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--panel)}

/* Responsive shell */
@media (max-width:1180px){.copilot.on{position:fixed;right:0;top:0;bottom:0;z-index:70;box-shadow:var(--shadow-lg)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:75;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.on{transform:none}
  .menu-btn{display:grid}
  .cmdk{min-width:0;width:40px;padding:0;justify-content:center}
  .cmdk span,.cmdk kbd{display:none}
  .hide-sm{display:none}
  .copilot.on{width:100%}
  .cp-in{width:100%}
  .gantt{grid-template-columns:170px minmax(0,1fr)}
  .fields{grid-template-columns:1fr}
}

/* PM: executive + overview */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.rag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.rg-g{background:var(--ok-bg);color:var(--ok)}.rg-y{background:var(--warn-bg);color:var(--warn)}.rg-r{background:var(--crit-bg);color:var(--crit)}
.rdot{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line);flex:none;vertical-align:middle}
.ekpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ekpis .kpi strong{font-size:23px}
@media (max-width:1280px){.ekpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.ekpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ai-sum{margin-bottom:16px;border-color:var(--lime-2);background:linear-gradient(var(--lime-3),var(--panel) 60%)}
.orb-s{width:26px;height:26px;border-radius:8px;background:var(--forest);color:var(--lime);display:grid;place-items:center}.orb-s svg{width:14px;height:14px}
.exec-t td:first-child{min-width:230px}.exec-t td:last-child{min-width:190px}
.bva{display:flex;flex-direction:column;gap:5px;min-width:170px}
.pvm{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.tri-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;padding:10px}
.tri-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid transparent;border-radius:10px;background:none;text-align:center}
.tri-cell:hover{border-color:var(--line);background:var(--hover)}
.tri-cell b{font-size:12.5px;font-weight:600;line-height:1.25}
.mtrack{position:relative;height:150px;margin:14px 28px 10px}
.mline{position:absolute;left:0;right:0;top:12px;height:3px;background:var(--line);border-radius:2px}
.mtick{position:absolute;top:0;transform:translateX(-50%);font:500 10.5px var(--fm);color:var(--faint);white-space:nowrap;margin-top:-14px}
.mdot{position:absolute;top:5px;transform:translateX(-50%);background:none;border:0;padding:0;width:18px;height:18px}
.mdot i{display:block;width:13px;height:13px;margin:2px auto;transform:rotate(45deg);background:var(--c);border:2px solid var(--forest)}
.mdot span{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink);box-shadow:var(--shadow)}
.mdot span em{font-style:normal;color:var(--muted);margin-left:6px;font-family:var(--fm);font-size:10.5px}
.mdot:hover span{border-color:var(--pine);z-index:3}
.heat{width:100%;border-collapse:collapse;min-width:900px}
.heat th{font-size:11px;font-weight:500;color:var(--muted);padding:10px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line-2)}
.heat td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line-2)}
.heat td:first-child{text-align:left;padding-left:16px}
.heat td:nth-last-child(-n+2){text-align:right;padding-right:16px;font-size:12.5px}
.hc{display:grid;place-items:center;height:36px;border-radius:7px;font:600 12px var(--fm)}
.h0{background:var(--line-2);color:var(--faint)}.h1{background:color-mix(in srgb,var(--s-done) 18%,var(--panel));color:var(--ink)}.h2{background:color-mix(in srgb,var(--s-done) 45%,var(--panel));color:var(--ink)}.h3{background:color-mix(in srgb,var(--p-high) 45%,var(--panel));color:var(--ink)}.h4{background:color-mix(in srgb,var(--p-urgent) 60%,var(--panel));color:#fff}
.legend i.h1,.legend i.h2,.legend i.h3,.legend i.h4{width:14px;height:10px}
.rperson{display:flex;gap:10px;align-items:center;background:none;border:0;padding:4px 0;text-align:left}
.rperson b{display:block;font-weight:600;font-size:13px}.rperson small{color:var(--muted);font-size:11.5px}
.rperson:hover b{color:var(--pine)}
.alloc{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:10px;align-items:center;padding:7px 0;font-size:12.5px}
.stack{display:flex;height:14px;background:var(--line-2);border-radius:7px;overflow:hidden;position:relative}
.stack i{display:block;height:100%}
.status-bar{display:flex;gap:16px;align-items:center;padding:14px 16px;margin-bottom:16px;border-left-width:4px;flex-wrap:wrap}
.rg-b-g{border-left-color:#10B981}.rg-b-y{border-left-color:#F59E0B}.rg-b-r{border-left-color:#E5484D}
.composer{padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px;border-color:var(--pine)}
.composer textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);resize:vertical;font-size:14px;line-height:1.5}
.ragbtns{display:flex;gap:8px;flex-wrap:wrap}
.ragbtns button{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:500}
.ragbtns button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1200px){.grid3{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;padding:14px 16px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;display:flex;gap:6px;align-items:center;justify-content:flex-end;text-align:right;flex-wrap:wrap}
.tc-rows{display:flex;flex-direction:column;gap:8px;padding:4px 16px 16px}
.tc-rows div{display:flex;flex-direction:column;gap:2px}
.tc-rows .sub{font-size:12px;padding-left:22px}
.ax{font:500 10.5px var(--fm);fill:var(--muted)}
.sprint-h{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;padding:16px 18px}
.goal-in{width:100%;margin-top:4px;font:500 14px var(--f);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg,transparent);color:var(--ink)}
.goal-in:focus{outline:2px solid var(--pine);outline-offset:1px}
.sp-kpis{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px 18px;flex:1.2;min-width:300px}
.sp-kpis small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

function conflicts(list){const out=[];list.forEach(t=>t.deps.forEach(d=>{const p=byId(d);if(p&&p.status!=='done'&&t.start<=p.due&&t.status!=='done')out.push([p,t])}));return out}
function autoSchedule(pid){let moved=0;for(let pass=0;pass<30;pass++){let ch=false;tasks.filter(t=>t.p===pid&&t.status!=='done').forEach(t=>{const pre=t.deps.map(byId).filter(p=>p&&p.status!=='done');if(!pre.length)return;const need=addD(pre.map(p=>p.due).sort().pop(),1);if(t.start<need){const dur=diff(t.start,t.due);t.start=need;t.due=addD(need,dur);ch=true;moved++}});if(!ch)break}save();return moved}
function load14(){const end=off(14);const m={};Object.keys(PEOPLE).forEach(k=>m[k]=0);tasks.forEach(t=>{if(t.status==='done'||t.due<TODAY||t.start>end)return;const span=Math.max(1,diff(t.start,t.due)+1);const ov=Math.max(1,diff(t.start<TODAY?TODAY:t.start,t.due>end?end:t.due)+1);m[t.owner]+=t.est*ov/span});return m}
function insights(pid){
  const L=pid?tasks.filter(t=>t.p===pid):tasks;const out=[];
  L.filter(late).forEach(t=>out.push({k:'crit',ic:'i-alert',b:'Overdue: '+t.title,p:(PEOPLE[t.owner]||{}).n+' · was due '+fmt(t.due)+' · '+PJ[t.p].name,acts:[['remind','Send reminder',t.id],['open','Open',t.id]]}));
  conflicts(L).forEach(([a,b])=>out.push({k:'warn',ic:'i-link',b:'Schedule conflict: '+b.title,p:'Starts '+fmt(b.start)+' but depends on “'+a.title+'”, due '+fmt(a.due)+'.',acts:[['autosched','Auto-schedule',b.p],['open','Open',b.id]]}));
  L.filter(t=>t.status==='doing'&&blockers(t).length).forEach(t=>out.push({k:'warn',ic:'i-alert',b:'Blocked: '+t.title,p:'Waiting on '+blockers(t).map(x=>'“'+x.title+'”').join(', ')+'.',acts:[['open','Open',t.id]]}));
  L.filter(soon).slice(0,4).forEach(t=>out.push({k:'info',ic:'i-clock',b:'Due '+(diff(TODAY,t.due)===0?'today':'in '+diff(TODAY,t.due)+' day'+(diff(TODAY,t.due)===1?'':'s'))+': '+t.title,p:(PEOPLE[t.owner]||{}).n+' · '+SL[t.status]+(t.sub.length?' · '+subProg(t)+'% of checklist done':''),acts:[['open','Open',t.id]]}));
  if(!pid||pid==='p4'){const p=PJ.p4;const g=timePct(p)-p.spent;if(g>=15)out.push({k:'crit',ic:'i-dollar',b:p.name+' is underspent',p:'Spend '+p.spent+'% vs. '+timePct(p)+'% of time elapsed. Plan the remaining $37,000 before the period ends '+fmt(p.end)+'.',acts:[['goproj','Open project','p4']]})}
  if(!pid){const l=load14();Object.entries(l).forEach(([k,h])=>{if(h>60)out.push({k:'warn',ic:'i-users',b:PEOPLE[k].n+' is overloaded',p:Math.round(h)+' hours of work due in the next 14 days, against about 60 available.',acts:[['rebalance','See their tasks',k]]})})}
  return out;
}

/* Gantt */
const ZW={day:30,week:13,month:4.5};
function crit(list){const L=list.filter(t=>t.status!=='done');const memo={};const ef=t=>{if(memo[t.id]!=null)return memo[t.id];const pre=t.deps.map(byId).filter(p=>p&&L.includes(p));memo[t.id]=Math.max(1,diff(t.start,t.due)+1)+(pre.length?Math.max(...pre.map(ef)):0);return memo[t.id]};L.forEach(ef);let end=L.sort((a,b)=>memo[b.id]-memo[a.id])[0];const set=new Set();while(end){set.add(end.id);const pre=end.deps.map(byId).filter(p=>p&&memo[p.id]!=null);end=pre.sort((a,b)=>memo[b.id]-memo[a.id])[0]}return set}
let G={};
function vGantt(a){
  a=[...a].sort((x,y)=>x.start<y.start?-1:x.start>y.start?1:x.due<y.due?-1:1);
  if(!a.length)return '<div class="empty">No tasks match these filters.</div>';
  const w=ZW[S.zoom];const sb=t=>S.showBase&&t.bStart&&t.bStart<t.start?t.bStart:t.start,db=t=>S.showBase&&t.bDue&&t.bDue>t.due?t.bDue:t.due;let s0=a.reduce((m,t)=>sb(t)<m?sb(t):m,sb(a[0])),s1=a.reduce((m,t)=>db(t)>m?db(t):m,db(a[0]));
  if(TODAY<s0)s0=TODAY;if(TODAY>s1)s1=TODAY;
  s0=addD(s0,-4);s1=addD(s1,S.zoom==='month'?20:10);if(S.zoom==='week'){const d=parse(s0);s0=addD(s0,-d.getDay())}
  const n=diff(s0,s1)+1,W=n*w;G={s0,w,rows:a.map(t=>t.id)};
  const cs=S.crit?crit(a):new Set();const cf=new Set(conflicts(a).map(x=>x[1].id));
  // months
  let months='',cur=parse(s0),x=0;while(x<n){const mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,1);const len=Math.min(n-x,Math.round((mEnd-cur)/864e5));months+=`<div style="width:${len*w}px">${len*w>40?MN[cur.getMonth()]+' '+cur.getFullYear():''}</div>`;x+=len;cur=mEnd}
  let ticks='',bg='';for(let i=0;i<n;i++){const d=parse(addD(s0,i));if(S.zoom==='day')ticks+=`<div style="width:${w}px">${d.getDate()}</div>`;else if(S.zoom==='week'&&d.getDay()===0)ticks+=`<div style="width:${7*w}px">${MN[d.getMonth()]} ${d.getDate()}</div>`;else if(S.zoom==='month'&&d.getDate()===1)ticks+='';if(S.zoom!=='month'&&d.getDay()%6===0)bg+=`<div class="g-bg" style="left:${i*w}px;width:${w}px"></div>`}
  if(S.zoom==='month')ticks=`<div style="width:${W}px;border-left:0;padding-left:8px">Drag bars to move · drag the right edge to change length</div>`;
  const tx=diff(s0,TODAY)*w+w/2;
  const left=a.map(t=>`<div class="g-row">${av(t.owner)}<button data-act="open" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>${S.showBase&&t.bDue&&t.due>t.bDue&&t.status!=='done'?`<span class="var" title="Behind baseline">+${diff(t.bDue,t.due)}d</span>`:''}${!t.base?'<span class="pill info np" style="font-size:10px;padding:2px 6px" title="Added after baseline">New</span>':''}<span class="st ${t.status}" style="color:var(--s-${t.status})" title="${SL[t.status]}"><i></i></span></div>`).join('');
  const bars=a.map((t,i)=>{const l=diff(s0,t.start)*w,len=(diff(t.start,t.due)+1)*w,top=i*40+8;const col=`var(--s-${t.status})`;
    if(t.ms)return `<div class="gms" data-gbar="${t.id}" data-mode="move" style="left:${diff(s0,t.due)*w+w/2-8}px;top:${i*40+12}px" title="${esc(t.title)} · ${fmt(t.due)}"></div><div class="g-out" style="left:${diff(s0,t.due)*w+w/2+14}px;top:${i*40+12}px">${esc(t.title)} · ${fmt(t.due)}</div>`;
    const sp=t.status==='done'?100:subProg(t)||(t.status==='doing'?40:t.status==='review'?85:0);
    const bl=S.showBase&&t.bStart&&t.base?`<div class="gbase" style="left:${diff(s0,t.bStart)*w}px;width:${Math.max(4,(diff(t.bStart,t.bDue)+1)*w)}px;top:${i*40+34}px" title="Baseline ${fmt(t.bStart)} – ${fmt(t.bDue)}"></div>`:'';
    return bl+`<div class="gbar${cs.has(t.id)?' crit':''}${cf.has(t.id)?' conf':''}" data-gbar="${t.id}" data-mode="move" style="left:${l}px;width:${Math.max(len,8)}px;top:${top}px;background:${col}" title="${esc(t.title)} · ${fmt(t.start)} – ${fmt(t.due)}"><span class="fill" style="width:${sp}%"></span><span class="lab">${len>70?esc(t.title):''}</span><span class="gh" data-mode="resize"></span></div>${len<=70?`<div class="g-out" style="left:${l+Math.max(len,8)+6}px;top:${top+4}px">${esc(t.title)}</div>`:''}`}).join('');
  return `<div class="gantt" id="gantt"><div class="g-left"><div class="g-head">Task</div>${left}</div>
    <div class="g-right" style="width:${W}px"><div class="g-head"><div class="g-months">${months}</div><div class="g-ticks">${ticks}</div></div>
    <div class="g-body" id="gbody" style="height:${a.length*40}px">${bg}${a.map(()=>'<div class="g-grow"></div>').join('')}<div class="g-today" style="left:${tx}px"><span>Today</span></div><svg class="g-deps" id="gdeps" width="${W}" height="${a.length*40}"></svg>${bars}</div></div></div>
  <div class="legend">${STATUSES.map(([k,l])=>`<span><i style="background:var(--s-${k})"></i>${l}</span>`).join('')}${S.showBase?'<span><i style="background:var(--ink-2);opacity:.38;height:4px"></i>Baseline</span>':''}<span><i style="background:transparent;outline:2px solid var(--crit)"></i>Critical path</span><span><i style="background:transparent;outline:2px dashed var(--crit)"></i>Conflict</span>${cf.size?`<button class="btn sm" data-act="autosched" data-p="${S.route==='project'?S.pid:''}">${svg('i-bolt')}Fix ${cf.size} conflict${cf.size>1?'s':''} automatically</button>`:''}</div>`;
}
function drawDeps(){const sv=document.getElementById('gdeps');if(!sv)return;const {s0,w,rows}=G;let h='<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7E8682"/></marker></defs>';rows.forEach((id,i)=>{const t=byId(id);t.deps.forEach(d=>{const j=rows.indexOf(d);if(j<0)return;const p=byId(d);const x1=(diff(s0,p.due)+1)*w,y1=j*40+20,x2=diff(s0,t.start)*w,y2=i*40+20;const bad=t.start<=p.due&&t.status!=='done'&&p.status!=='done';const mx=Math.max(x1+8,Math.min(x2-8,x1+8));h+=`<path d="M${x1} ${y1} H${mx} V${y2} H${x2-1}" fill="none" stroke="${bad?'#C02A2A':'#9AA19C'}" stroke-width="1.5" ${bad?'stroke-dasharray="4 3"':''} marker-end="url(#ar)"/>`})});sv.innerHTML=h}

  return `<div class="greet"><div><h1>Resources</h1><p class="sub" style="margin-top:4px">Planned hours per person per week from task estimates · capacity 40 h a week</p></div><button class="btn ai" data-act="ask" data-q="Look at the team's weekly workload for the next 8 weeks. Who is over or under capacity, and what specific tasks should move to balance it? Make the changes if I confirm.">${svg('i-spark')}Balance workload</button></div>

  <div style="overflow-x:auto"><table class="heat"><thead><tr><th style="text-align:left">Person</th>${Array.from({length:n},(_,w)=>`<th>${w===0?'This week':fmt(addD(s0,w*7))}</th>`).join('')}<th>8-week total</th><th>Planned cost</th></tr></thead><tbody>
  ${Object.entries(PEOPLE).map(([k,p])=>{const row=out[k];const tot=row.reduce((a,b)=>a+b,0);return `<tr><td><button class="rperson" data-act="rebalance" data-id="${k}">${av(k,1)}<span><b>${esc(p.n)}</b><small>${esc(p.r)} · $${RATE[k]}/h</small></span></button></td>${row.map(h=>`<td><span class="hc ${lvl(h)}">${Math.round(h)||''}</span></td>`).join('')}<td class="mono tnum">${Math.round(tot)} h</td><td class="mono tnum">${money(tot*RATE[k])}</td></tr>`}).join('')}
  </tbody></table></div></section>
  <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Allocation by project · next 4 weeks</h2><p class="sub">Where each person's planned hours go</p></div><div class="legend" style="margin:0">${PROJECTS.map(p=>`<span><i style="background:${p.color}"></i>${esc(p.name)}</span>`).join('')}</div></div>
  <div style="padding:10px 16px 16px">${Object.entries(PEOPLE).map(([k,p])=>{const parts=PROJECTS.map(pr=>({pr,h:per[pr.id][k].reduce((a,b)=>a+b,0)})).filter(x=>x.h>=.5);const tot=parts.reduce((a,b)=>a+b.h,0);return `<div class="alloc"><span style="display:flex;gap:8px;align-items:center">${av(k)}${esc(p.n.split(' ')[0])}</span><div class="stack">${parts.map(x=>`<i style="width:${x.h/160*100}%;background:${x.pr.color}" title="${esc(x.pr.name)}: ${Math.round(x.h)} h"></i>`).join('')}<span class="cap" style="left:100%"></span></div><span class="mono tnum" style="text-align:right">${Math.round(tot)} / 160 h</span></div>`}).join('')}</div></section>`;
}

function composerHTML(p,m){return `<section class="card-box composer" aria-label="New status update"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>New status update</b><span class="sub">Suggested from data: ${rag(m.overall)}</span></div>

function fillUpd(){const p=PJ[S.pid],m=M(p);const doing=m.P.filter(t=>t.status==='doing').slice(0,3).map(t=>t.title);const nxt=m.P.filter(t=>t.status==='todo').sort((a,b)=>a.due<b.due?-1:1).slice(0,2).map(t=>t.title+' ('+fmt(t.due)+')');

/* Server AI bridge: outside Claude, talk to /api/copilot (OpenAI GPT proxy with budgets) through the same sample() interface. */
async function netlifySample(){
  let info;try{const r=await fetch('/api/copilot',{cache:'no-store'});if(!r.ok)return null;info=await r.json()}catch(e){return null}
  if(!info||!info.ok)return null;
  const CK='juno-copilot-code';
  const getCode=()=>{let c='';try{c=localStorage.getItem(CK)||''}catch(e){}if(!c&&info.needsCode){c=(window.prompt('Enter the Copilot access code')||'').trim();try{c&&localStorage.setItem(CK,c)}catch(e){}}return c};
  const err=(code,message,text)=>Object.assign(new Error(message),{code,text});
  async function call(body,signal,tier,feature){const h={'content-type':'application/json','x-juno-ws':(typeof S!=='undefined'&&S.ws)||'w1','x-juno-tier':tier||'default','x-juno-feature':feature||''};if(info.needsCode)h['x-juno-code']=getCode();
    let r;try{r=await fetch('/api/copilot',{method:'POST',headers:h,body:JSON.stringify(body),signal})}catch(e){if(e.name==='AbortError')throw err('cancelled','Stopped');throw err('network','Network error')}
    if(r.status===401){try{localStorage.removeItem(CK)}catch(e){}throw err('not_granted','Wrong access code')}
    if(r.status===402)throw err('budget_exceeded','This workspace reached its monthly AI budget.');
    if(r.status===429)throw err('rate_limited','Too many requests');
    const j=await r.json().catch(()=>({}));if(!r.ok)throw err('failed',(j.error&&j.error.message)||j.error||('HTTP '+r.status));return j}
  async function sample(input,opts={}){
    const msgs=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:String(m.content)}));
    const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description||'',input_schema:t.inputSchema||{type:'object',properties:{}}}));
    let text='';const usage={input_tokens:0,output_tokens:0,cached_tokens:0,model:''};
    for(let round=0;round<8;round++){
      if(opts.signal&&opts.signal.aborted)throw err('cancelled','Stopped',text);
      let res;try{res=await call({messages:msgs,tools,max_tokens:opts.modelTier==='quick'?800:1600},opts.signal,opts.modelTier,opts.feature)}catch(e){if(e.code==='cancelled')e.text=text;sample._lastUsage=usage.input_tokens?usage:null;throw e}
      if(res.usage){usage.input_tokens+=res.usage.input_tokens||0;usage.output_tokens+=res.usage.output_tokens||0;usage.cached_tokens+=res.usage.cached_tokens||0;usage.model=res.model||usage.model}
      const content=res.content||[];
      const t=content.filter(c=>c.type==='text').map(c=>c.text).join('');
      if(t){text+=(text?'\n\n':'')+t;opts.onText&&opts.onText({text,delta:t})}
      const uses=content.filter(c=>c.type==='tool_use');
      if(res.stop_reason!=='tool_use'||!uses.length){sample._lastUsage=usage;return {text,truncated:res.stop_reason==='max_tokens',usage}}
      msgs.push({role:'assistant',content});
      const results=[];
      for(const u of uses){const tool=(opts.tools||[]).find(x=>x.name===u.name);let out,isErr=false;
        try{out=tool?await tool.execute(u.input||{}):{error:'unknown tool'}}catch(e){out={error:String(e&&e.message||e)};isErr=true}
        results.push({type:'tool_result',tool_use_id:u.id,content:JSON.stringify(out==null?{ok:true}:out),is_error:isErr})}
      msgs.push({role:'user',content:results});
    }
    sample._lastUsage=usage;return {text,truncated:true,usage}}
  sample.json=async(input,opts={})=>{const add='\n\nRespond with valid JSON only. No prose, no code fences.';
    const inp=typeof input==='string'?input+add:input.map((m,i)=>i===input.length-1?{...m,content:m.content+add}:m);
    const r=await sample(inp,opts);const m=r.text.match(/[\[{][\s\S]*[\]}]/);if(!m)throw err('bad_json','No JSON in reply');return JSON.parse(m[0])};
  sample.limits=async()=>({images:false});
  return sample}

const costOf=(model,tin,tout,tc)=>{const p=priceOf(model);return ((tin-(tc||0))*p.in+(tc||0)*p.cin+tout*p.out)/1e6};
function seedAiLog(){const out=[];const m=TODAY.slice(0,8);const today=+TODAY.slice(8,10);const F=[['Copilot',.38],['Drafting',.3],['Solicitation reader',.12],['Award reader',.06],['Funder reports',.08],['Status updates',.06]];
  const target={w1:.31,w2:.27,w3:.86,w4:.14};let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};

    days.forEach((wt,i)=>{let dayTok=total*wt/sum;const n=Math.max(1,Math.round(dayTok/350000));for(let k=0;k<n;k++){const f=F.find((x,j)=>{let acc=F.slice(0,j+1).reduce((s,y)=>s+y[1],0);return rnd()<=acc})||F[0];const tok=dayTok/n;const tout=Math.round(tok*.09),tin=Math.round(tok-tout),tc=Math.round(tin*.35);const model=f[0]==='Solicitation reader'||f[0]==='Award reader'?aiCfg.fast:aiCfg.model;
      out.push({ws:w.id,day:m+String(i+1).padStart(2,'0'),at:m+String(i+1).padStart(2,'0'),feature:f[0],user:w.users[Math.floor(rnd()*w.users.length)],tin,tout,tc,model,cost:costOf(model,tin,tout,tc),src:'sample'})}})});return out}
function monthUse(ws,mk){mk=mk||monthKey();const L=aiLog.filter(x=>x.ws===ws&&x.day.slice(0,7)===mk);const tok=L.reduce((s,x)=>s+x.tin+x.tout,0),cost=L.reduce((s,x)=>s+x.cost,0);return {L,tok,cost,calls:L.length}}

function featureOf(input,opts){if(opts&&opts.feature)return opts.feature;const t=typeof input==='string'?input:JSON.stringify(input).slice(0,600);if(/award letter/i.test(t))return 'Award reader';if(/compliance matrix from this solicitation/i.test(t))return 'Solicitation reader';if(/draft proposal sections/i.test(t))return 'Drafting';if(/report narrative|progress report|funder/i.test(t))return 'Funder reports';if(/status update/i.test(t))return 'Status updates';if(opts&&opts.tools&&opts.tools.length)return 'Copilot';return 'Other AI'}

/* ---------- extraction: solicitation to compliance matrix ---------- */
function parseSolicitation(text){const L=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const reqs=[];let n=0;
  L.forEach(l=>{const isReq=/\b(describe|provide|explain|submit|include|demonstrate|identify|list|attach|must|shall|is (?:your|the)|what is|do you|are you|how will)\b/i.test(l)||/\?$/.test(l);if(!isReq||l.length<15||/^(applications|proposals) (are )?due/i.test(l))return;
    const ref=(l.match(/^((?:[A-Z]\.)?\d+(?:\.\d+)*|[A-Z]-?\d+(?:\.\d+)*|SQ-\d+)[.)]?\s/)||[])[1]||('R'+(++n));
    const lim=(l.match(/(\d+)\s*(pages?|pp\.?)/i)||[]);const pts=+((l.match(/(\d+)\s*points?/i)||[])[1]||0);
    const form=/\b(form|w-9|sf-?\d+|insurance|certificate|certification|letter of)\b/i.test(l)&&!/describe|explain/i.test(l);
    const clean=l.replace(/^((?:[A-Z]\.)?\d+(?:\.\d+)*|[A-Z]-?\d+(?:\.\d+)*|SQ-\d+)[.)]?\s+/,'').replace(/\s*\(([^)]*(page|point|pp)[^)]*)\)\s*\.?$/i,'').replace(/^(applicants|offerors|the applicant|the offeror)\s+(must|shall)\s+/i,'').replace(/^./,c=>c.toUpperCase());
    reqs.push({ref,text:clean.slice(0,200),limit:lim[1]?lim[1]+(+lim[1]>1?' pp':' p'):'—',pts,kind:form?'form':'narrative'})});
  return reqs.slice(0,40)}
const shortTitle=t=>{let s=t.replace(/^(describe|provide|explain|submit|include|demonstrate|identify|list)\s+(your |the |a |an |how you will |how )?/i,'').replace(/\?$/,'');s=s.split(/[,.;:]| and (?:its|the|their)| with /)[0];return (s.charAt(0).toUpperCase()+s.slice(1)).slice(0,48)};
function buildPursuit(o){const id='r'+Date.now().toString(36);const reqs=o.reqs.map((r,i)=>({id:'q'+(i+1),ref:r.ref,text:r.text,limit:r.limit||'—',pts:+r.pts||0,kind:r.kind==='form'?'form':'narrative',sec:'',done:false}));const secs=[];
  reqs.filter(r=>r.kind==='narrative').forEach((r,i)=>{const sid='s'+(i+1);r.sec=sid;const isPrice=/pric|cost proposal|budget/i.test(r.text);secs.push({id:sid,title:shortTitle(r.text),crit:r.text,pts:r.pts,limit:r.limit,owner:isPrice?'priya':o.team.writer[i%o.team.writer.length],status:'todo',text:'',src:[],flag:'',locked:false,allow:isPrice?['priya','rosa',ME]:[],ver:[],due:addD(o.due,-7)})});
  const gates=(o.type==='sq'?['red']:['blue','pink','red']).map((k,i,a)=>({k,status:i===0?'active':'scheduled',due:addD(o.due,-Math.round((a.length-i)*(diff(TODAY,o.due)/(a.length+1)))),scores:{},items:[]}));
  return {id,ws:o.ws,name:o.name,type:o.type,buyer:o.buyer,sector:o.sector||'Public sector',value:o.value||null,due:o.due,gid:o.gid||null,created:TODAY,reqs,secs,gates,comments:[],qa:[],team:o.team,approval:null,outcome:null,method:o.method}}

function libFor(ws){return library.filter(l=>l.ws===ws&&l.approved)}
function matchLib(pr,sec){const q=sec.title+' '+sec.crit+' '+pr.reqs.filter(r=>r.sec===sec.id).map(r=>r.text).join(' ');return libFor(pr.ws).map(l=>({l,s:sim(q,l.title+' '+l.tags.join(' ')+' '+l.text)})).sort((a,b)=>b.s-a.s)}
async function draftSection(pr,sec){if(sec.locked){toast('This section is locked');return}const m=matchLib(pr,sec);const good=m.filter(x=>x.s>=.1).slice(0,2);sec.busy=true;render();
  let out=null;
  if(sample&&m.length){try{const blocks=m.slice(0,4).map(x=>`[${x.l.id}] ${x.l.title}: ${x.l.text}`).join('\n');const r=await sample.json(`You draft proposal sections ONLY from approved content. Requirement(s): ${pr.reqs.filter(r=>r.sec===sec.id).map(r=>r.ref+' '+r.text).join(' | ')||sec.crit}. Evaluation criterion: ${sec.crit}. Approved content blocks:\n${blocks}\nWrite 1 to 3 short paragraphs that answer the requirement using only facts in the blocks. End each paragraph with the ids of the blocks it used in square brackets, like [L2]. If the blocks do not contain enough facts to answer, do not write filler: return {"flag":"<what an expert must supply>","paragraphs":[]}. Return JSON {"paragraphs":[{"text":string,"src":[ids]}],"flag":string}.`,{modelTier:'default'});
    if(r&&Array.isArray(r.paragraphs)){const ids=new Set(m.map(x=>x.l.id));const ps=r.paragraphs.map(p=>({text:String(p.text||'').replace(/\s*\[[^\]]*\]\s*$/,''),src:(p.src||[]).filter(i=>ids.has(i))})).filter(p=>p.text&&p.src.length);out={ps,flag:String(r.flag||'').slice(0,200)}}}catch(e){}}
  if(!out){out={ps:good.map(x=>({text:x.l.text,src:[x.l.id]})),flag:good.length?'':'No approved content in this workspace covers this requirement. Assign a subject-matter expert instead of filling it with generic text.'}}
  sec.busy=false;if(out.ps.length){sec.text=out.ps.map(p=>p.text+' ['+p.src.join(', ')+']').join('\n\n');sec.src=[...new Set(out.ps.flatMap(p=>p.src))];sec.flag=out.flag&&out.ps.length<2?out.flag:'';sec.status='drafted';sec.ver.push({n:sec.ver.length+1,at:TODAY,by:ME,text:sec.text,note:sample?'AI draft from library':'Draft from library'});sec.src.forEach(id=>{const l=library.find(x=>x.id===id);if(l)l.uses++})}else{sec.flag=out.flag||'No approved content covers this requirement. Assign an SME.';sec.status='sme'}
  save();render();toast(out.ps.length?'Drafted from '+sec.src.length+' approved source'+(sec.src.length>1?'s':''):'Flagged for an expert: no approved content covers this')}
const reqStatus=(pr,r)=>{if(r.kind==='form')return r.done?['ok','Attached']:['crit','Missing'];const s=pr.secs.find(x=>x.id===r.sec);if(!s)return ['crit','Unassigned'];return s.status==='final'?['ok','Final']:s.status==='drafted'?['info','Drafted']:s.status==='sme'?['warn','Needs SME']:['', 'Not started']};

  <section class="card-box ixf" style="padding:18px"><div class="ixr"><label style="flex:2">Pursuit name<input class="sel" data-rx="name" value="${esc(X.name)}"></label><label>Buyer<input class="sel" data-rx="buyer" value="${esc(X.buyer)}"></label></div>
   <div class="ixr"><label>Type<select class="sel" data-rx="type">${Object.entries(PTYPE).map(([k,v])=>`<option value="${k}"${X.type===k?' selected':''}>${v}</option>`).join('')}</select></label><label>Workspace<select class="sel" data-rx="ws">${WS.map(w=>`<option value="${w.id}"${X.ws===w.id?' selected':''}>${esc(w.n)}</option>`).join('')}</select></label><label>Due<input class="sel" type="date" data-rx="due" value="${X.due}"></label><label>Estimated value ($)<input class="sel" type="number" data-rx="value" value="${X.value||''}"></label></div></section>
  <section class="card-box" style="margin-top:16px"><div style="overflow-x:auto"><table class="btab" style="min-width:820px"><thead><tr><th style="width:80px">Ref</th><th>Requirement</th><th style="width:90px">Limit</th><th style="width:80px">Points</th><th style="width:130px">Type</th><th style="width:40px"></th></tr></thead><tbody>${X.reqs.map((r,i)=>`<tr><td><input class="cell-in" data-rx="reqs.${i}.ref" value="${esc(r.ref)}" aria-label="Reference"></td><td><input class="cell-in" data-rx="reqs.${i}.text" value="${esc(r.text)}" aria-label="Requirement"></td><td><input class="cell-in" data-rx="reqs.${i}.limit" value="${esc(r.limit)}" aria-label="Page limit"></td><td><input class="cell-in" type="number" data-rx="reqs.${i}.pts" value="${r.pts}" aria-label="Points"></td><td><select class="cell-sel" data-rx="reqs.${i}.kind" aria-label="Type"><option value="narrative"${r.kind!=='form'?' selected':''}>Narrative</option><option value="form"${r.kind==='form'?' selected':''}>Form / attachment</option></select></td><td><button class="icon-btn" data-act="rxdel" data-i="${i}" aria-label="Remove">${svg('i-x')}</button></td></tr>`).join('')}</tbody></table></div><div style="padding:12px 16px"><button class="btn sm" data-act="rxadd">${svg('i-plus')}Add requirement</button></div></section>`}
const SAMPLE_RFP=`REQUEST FOR PROPOSAL (SAMPLE)\nRiverside County Workforce Board\nRegional Digital Skills Training Services\nProposals due ${fmtL(off(25))}. Estimated value $450,000 over two years.\n\nSection L. Proposal instructions\nL.3.1 Describe the offeror's organization and experience delivering workforce training. (2 pages, 15 points)\nL.3.2 Describe the staffing approach and qualifications of key personnel. (3 pages, 20 points)\nL.3.3 Provide past performance with three references and quantified outcomes. (4 pages, 20 points)\nL.3.4 Describe the digital skills curriculum and delivery model. (4 pages, 20 points)\nL.3.5 Describe how participant data will be protected. (2 pages, 10 points)\nL.3.6 Provide a cost proposal using the county pricing form. (15 points)\n\nSection M. Required forms\nOfferors must submit a signed county vendor certification form.\nOfferors must submit proof of insurance.`;
async function rxExtract(){const ta=document.getElementById('rxText');const text=(ta?ta.value:S.rx.text||'').trim();S.rx.text=text;if(text.length<40){toast('Paste the solicitation text first');return}S.rx.busy=true;render();
  const L=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let reqs=parseSolicitation(text),method='rules';const dueM=(text.match(/due[^.\n]*?([A-Za-z]{3,9}\.? \d{1,2},? \d{4}|\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{4})/i)||[])[1];
  let meta={name:(L[2]||L[1]||'New pursuit').slice(0,90),buyer:(L[1]||'').slice(0,90),due:toISO(dueM||'')||off(21),value:money2n((L.find(l=>/\$/.test(l))||''))||null,type:/questionnaire/i.test(text)?'sq':/request for information|\bRFI\b/i.test(text)?'rfi':/notice of funding|NOFO|request for applications|RFA|grant/i.test(text)?'grant':'rfp'};
  if(sample){try{const r=await sample.json(`Extract a compliance matrix from this solicitation. Return JSON {"name":short title,"buyer":issuing organization,"due":"YYYY-MM-DD" or "","value":number or 0,"reqs":[{"ref":reference like L.3.1 or R1,"text":the requirement in one sentence,"limit":page limit like "3 pp" or "—","pts":points as a number or 0,"kind":"narrative" or "form"}]}. Include every requirement, page limit, scoring criterion and required form. Use only the text.\n\n${text.slice(0,30000)}`,{modelTier:'default'});if(r&&Array.isArray(r.reqs)&&r.reqs.length){reqs=r.reqs.map(x=>({ref:String(x.ref||'R').slice(0,16),text:String(x.text||'').slice(0,220),limit:String(x.limit||'—').slice(0,12),pts:+x.pts||0,kind:x.kind==='form'?'form':'narrative'})).filter(x=>x.text);meta.name=String(r.name||meta.name).slice(0,90);meta.buyer=String(r.buyer||meta.buyer).slice(0,90);if(/^\d{4}-\d{2}-\d{2}$/.test(r.due))meta.due=r.due;if(+r.value)meta.value=+r.value;method='ai'}}catch(e){}}
  Object.assign(S.rx,meta,{reqs,method,busy:false,step:'review'});render()}

function prsHead(p){const g=curGate(p);return `<div class="phead"><div style="min-width:0"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1>${esc(p.name)}</h1>${p.approval?'<span class="pill ok">Approved</span>':g?`<span class="gate g-${g.k}">${GL[g.k]}</span>`:''}</div>

  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="pulse wide"><div><span>Compliance</span><span class="track"><i style="width:${compPct(p)}%;background:var(--pine)"></i></span><b class="mono">${compPct(p)}%</b></div><div><span>Open items</span><b class="mono">${openItems(p)}</b></div></div><button class="btn ai" data-act="ask" data-q="Review the pursuit &quot;${esc(p.name)}&quot;: which requirements are at risk, which sections need an expert, and what should the team do before the next review gate?">${svg('i-spark')}Bid check</button></div></div>`}
function vPursuit(){const p=pursuits.find(x=>x.id===S.prs);if(!p)return '<div class="empty"><p>Pursuit not found.</p></div>';const tabs=[['matrix','Compliance matrix'],['draft','Draft'],['review','Reviews & approval'],['team','Team'],['outcome','Outcome']];

function vMatrix(p){return `<section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Outline &amp; storyboard</h2><p class="sub">Sections mapped to the evaluation criteria</p></div><button class="btn sm" data-act="ptab" data-t="draft">Open the draft</button></div>

  ${p.reqs.map(r=>{const s=p.secs.find(x=>x.id===r.sec);const st=reqStatus(p,r);return `<tr><td class="mono">${esc(r.ref)}</td><td style="white-space:normal;min-width:240px">${esc(r.text)}</td><td class="mono">${esc(r.limit)}</td><td class="r mono">${r.pts||'—'}</td><td>${r.kind==='form'?'<span class="sub">Form</span>':`<select class="cell-sel" data-reqsec="${r.id}" aria-label="Section">${p.secs.map(x=>`<option value="${x.id}"${x.id===r.sec?' selected':''}>${esc(x.title)}</option>`).join('')}</select>`}</td><td>${s?av(s.owner):'—'}</td><td>${r.kind==='form'?`<button class="pill ${st[0]}" data-act="formtog" data-id="${r.id}" style="cursor:pointer;border:0">${st[1]} · ${r.done?'undo':'mark attached'}</button>`:`<span class="pill ${st[0]}">${st[1]}</span>`}</td></tr>`}).join('')}</tbody></table></div></section>
  <section class="card-box" style="margin-top:16px"><div class="panel-h"><div><h2 class="sec-title">Buyer Q&amp;A</h2><p class="sub">Clarifications captured against this pursuit</p></div></div>${p.qa.map(q=>`<div class="ins"><div style="flex:1"><b>Q: ${esc(q.q)}</b><p>A: ${esc(q.a)} · ${fmt(q.at)}</p></div></div>`).join('')||'<div class="ins"><p>No buyer questions yet. Answers forwarded to the inbox land here.</p></div>'}
   <div class="ixr" style="padding:12px 16px"><input class="sel" id="qaQ" placeholder="Question" style="flex:1"><input class="sel" id="qaA" placeholder="Buyer answer" style="flex:1"><button class="btn sm" data-act="addqa">Add</button></div></section>`}
const secPill=s=>s.status==='final'?'<span class="pill ok">Final</span>':s.status==='drafted'?'<span class="pill info">Drafted</span>':s.status==='sme'?'<span class="pill warn">Needs SME</span>':'<span class="pill">Not started</span>';
function canSee(s,who){return !s.allow||!s.allow.length||s.allow.includes(who)}
function wordDiff(a,b){const A=a.split(/(\s+)/),B=b.split(/(\s+)/);if(A.length*B.length>400000)return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;const n=A.length,m=B.length;const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,o='';while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){o+=`<del>${esc(A[i])}</del>`;i++}else{o+=`<ins>${esc(B[j])}</ins>`;j++}}while(i<n)o+=`<del>${esc(A[i++])}</del>`;while(j<m)o+=`<ins>${esc(B[j++])}</ins>`;return o}
function vDraft(p){const who=S.viewAs||ME;const vis=p.secs.filter(s=>canSee(s,who));const hid=p.secs.length-vis.length;const s=vis.find(x=>x.id===S.psec)||vis[0];

   ${vis.map(x=>`<button class="secitem${s&&x.id===s.id?' on':''}" data-act="psec" data-id="${x.id}"><span style="flex:1;min-width:0;text-align:left"><b>${esc(x.title)}</b><small>${esc(PEOPLE[x.owner].n.split(' ')[0])} · ${x.pts?x.pts+' pts':'—'}</small></span>${x.locked?svg('i-lock',13):''}${secPill(x)}</button>`).join('')}</aside>

   ${S.peek?(()=>{const l=library.find(x=>x.id===S.peek);return l?`<div class="peek"><b>[${l.id}] ${esc(l.title)}</b><p>${esc(l.text)}</p><small>${esc(l.source)} · by ${esc(PEOPLE[l.author].n)}</small></div>`:''})():''}
   <div style="display:flex;gap:8px;flex-wrap:wrap">${ed?`<button class="btn ai" data-act="draftsec" data-id="${s.id}" ${s.busy?'disabled':''}>${svg('i-spark')}${s.busy?'Drafting…':'Draft from approved library'}</button><button class="btn" data-act="savever" data-id="${s.id}">Save version</button>${s.status!=='final'?`<button class="btn" data-act="secfinal" data-id="${s.id}">Mark final</button>`:''}<button class="btn" data-act="secsme" data-id="${s.id}">Flag for SME</button>`:''}<button class="btn" data-act="seclock" data-id="${s.id}">${svg('i-lock')}${s.locked?'Unlock':'Lock section'}</button></div>

     ${S.cmp&&S.cmp.sec===s.id?(()=>{const v=s.ver.find(x=>x.n===S.cmp.n);return v?`<div class="peek"><b>v${v.n} → current</b><p class="diff">${wordDiff(v.text,s.text)}</p><button class="btn sm ghost" data-act="vclose">Close</button></div>`:''})():''}</div>
    <div><b style="font-size:13px;color:var(--ink)">Comments</b>${cs.map(c=>`<div class="pcmt${c.res?' res':''}"><div style="display:flex;gap:8px;align-items:center">${av(c.by)}<b>${esc(PEOPLE[c.by].n.split(' ')[0])}</b><span class="sub" style="font-size:11px">${fmt(c.at)}</span>${c.res?'<span class="pill ok np" style="margin-left:auto">Resolved</span>':`<button class="btn sm ghost" style="margin-left:auto" data-act="cres" data-id="${c.id}">Resolve</button>`}</div><p>${mentionHTML(c.text)}</p>${(c.rep||[]).map(r=>`<div class="prep">${av(r.by)}<p><b>${esc(PEOPLE[r.by].n.split(' ')[0])}</b> ${mentionHTML(r.text)}</p></div>`).join('')}${c.res?'':`<input class="sel creply" data-cid="${c.id}" placeholder="Reply, then Enter" style="margin-top:6px;width:100%;height:32px">`}</div>`).join('')||'<p class="sub" style="font-size:12.5px;margin:6px 0">No comments on this section.</p>'}

  <section class="card-box" style="margin-top:16px;padding:16px 18px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 class="sec-title">Approval &amp; export</h2><p class="sub">Nothing is exported until an authorized approver signs off.</p></div>${p.approval?`<span class="pill ok">Approved by ${esc(PEOPLE[p.approval.by].n)} · ${fmt(p.approval.at)}</span>`:''}</div>
   <div class="checks">${ck.map(([l,v])=>`<div class="${v?'ok':'no'}">${svg(v?'i-check':'i-x')}${l}</div>`).join('')}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">${p.approval?`<button class="btn primary" data-act="export" data-f="docx">Export Word</button><button class="btn primary" data-act="export" data-f="pdf">Export PDF</button><button class="btn primary" data-act="export" data-f="pptx">Export PowerPoint</button><button class="btn ghost" data-act="unapprove">Withdraw approval</button>`:`<button class="btn primary" data-act="approve" ${ok?'':'disabled'}>${svg('i-check')}Sign off as ${esc(PEOPLE[p.team.approver].n)} (approver)</button>${ok?'':'<span class="sub" style="font-size:12.5px">Complete the checklist to enable sign-off.</span>'}`}</div>

const TURN={ana:1.4,maya:2.1,dev:1.2,priya:2.6,rosa:1.8,sam:2.3};
function vWinLoss(){const H=history.slice();pursuits.filter(p=>p.outcome&&p.outcome.result!=='none').forEach(p=>H.push({name:p.name,buyer:p.buyer,sector:p.sector,value:p.value||0,result:p.outcome.result,reason:p.outcome.reason,competitor:p.outcome.competitor||'—',at:p.outcome.at,people:[...new Set([...p.team.writer,...p.team.sme,...p.secs.map(s=>s.owner)])],ws:p.ws}));const D=S.wlAll?H:H.filter(h=>h.ws===S.ws);
  const won=D.filter(h=>h.result==='won'),lost=D.filter(h=>h.result==='lost');const wr=D.length?Math.round(won.length/D.length*100):0;
  const rate=(key)=>{const m={};D.forEach(h=>{const k=key(h);m[k]=m[k]||{w:0,n:0};m[k].n++;if(h.result==='won')m[k].w++});return Object.entries(m).map(([k,v])=>({k,w:v.w,n:v.n,r:Math.round(v.w/v.n*100)})).sort((a,b)=>b.r-a.r||b.n-a.n)};
  const band=h=>h.value<100000?'Under $100K':h.value<500000?'$100K–$500K':h.value<1000000?'$500K–$1M':'Over $1M';
  const rbar=rows=>`<div class="hstack">${rows.map(r=>`<div class="hs-row" style="grid-template-columns:150px minmax(0,1fr) 70px"><span class="hs-l">${esc(r.k)}</span><div class="hs-bar"><i style="width:${r.r}%;background:${r.r>=50?'var(--s-done)':r.r>=34?'var(--s-doing)':'var(--crit)'}"></i></div><b class="tnum" style="white-space:nowrap;font-size:12.5px">${r.r}% <small class="sub">(${r.w}/${r.n})</small></b></div>`).join('')}</div>`;
  const reasons={};lost.forEach(h=>reasons[h.reason]=(reasons[h.reason]||0)+1);const RC=['#E5484D','#F59E0B','#8B5CF6','#3B82F6','#14B8A6','#EC4899','#94A3B8'];
  const lib=library.filter(l=>S.wlAll||l.ws===S.ws).sort((a,b)=>b.wins-a.wins).slice(0,5);
  const lb=Object.keys(PEOPLE).map(k=>{const ot=pursuits.reduce((s,p)=>s+p.secs.filter(x=>x.owner===k&&x.status==='final').length,0)+H.filter(h=>h.people.includes(k)).length*2;const reuse=library.filter(l=>l.author===k).reduce((s,l)=>s+l.wins,0);const ws_=H.filter(h=>h.result==='won'&&h.people.includes(k)).length;const t=TURN[k];return {k,ot,reuse,t,ws:ws_,score:Math.round(ot*2+reuse+ws_*5+(5-t)*3)}}).sort((a,b)=>b.score-a.score);
  const teams=WS.map(w=>{const hs=H.filter(h=>h.ws===w.id);return {w,won:hs.filter(h=>h.result==='won').length,n:hs.length}}).sort((a,b)=>b.won-a.won);
  return `<div class="greet"><div><h1>Win/loss &amp; leaderboard</h1><p class="sub" style="margin-top:4px">${S.wlAll?'All workspaces':esc(curWS().n)} · learn from every result</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="toggle" style="font-size:13px"><input type="checkbox" id="wlAll"${S.wlAll?' checked':''}> All workspaces</label><button class="btn ai" data-act="ask" data-q="Analyze our win/loss record: where do we win, where do we lose, which competitors beat us and why, and what should we change in our next three bids?">${svg('i-spark')}Explain patterns</button></div></div>

   <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Win rate by deal size</h2></div></div><div style="padding:14px 16px">${rbar(rate(band))}</div></section>
   <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Against competitors</h2><p class="sub">Our win rate when each competitor bid</p></div></div><div style="padding:14px 16px">${rbar(rate(h=>h.competitor).filter(r=>r.k!=='—'))}</div></section>
   <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Why we lose</h2></div></div><div style="padding:14px 16px">${donutSVG(Object.entries(reasons).map(([l,v],i)=>({l,v,c:RC[i%RC.length]})),lost.length,'losses')}</div></section>
   <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Win rate by buyer</h2></div></div><div style="padding:14px 16px">${rbar(rate(h=>h.buyer.replace(/\s*\(sample\)/,'')).sort((x,y)=>y.n-x.n||y.r-x.r).slice(0,8))}</div></section>
   <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Answers that appear most in wins</h2><p class="sub">From the content library</p></div></div>${lib.map(l=>`<div class="ins" style="align-items:center"><span class="mono sub" style="font-size:11px;width:36px">[${l.id}]</span><div style="flex:1;min-width:0"><b>${esc(l.title)}</b><p>${esc(WSM[l.ws].n)} · used ${l.uses}×</p></div><span class="pill ok">${l.wins} wins</span></div>`).join('')}</section></div>
  <div class="two" style="margin-top:16px"><section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Leaderboard · people</h2><p class="sub">Sections delivered on time, answers reused in wins, review turnaround and wins supported</p></div></div>
   <div style="overflow-x:auto"><table class="btab" style="min-width:560px"><thead><tr><th>#</th><th>Contributor</th><th class="r">On-time sections</th><th class="r">Reused in wins</th><th class="r">Review turnaround</th><th class="r">Wins supported</th><th class="r">Score</th></tr></thead><tbody>${lb.map((r,i)=>`<tr><td><span class="rank r${i}">${i+1}</span></td><td>${av(r.k)} ${esc(PEOPLE[r.k].n)}</td><td class="r mono">${r.ot}</td><td class="r mono">${r.reuse}</td><td class="r mono">${r.t} days</td><td class="r mono">${r.ws}</td><td class="r"><b class="mono">${r.score}</b></td></tr>`).join('')}</tbody></table></div></section>
