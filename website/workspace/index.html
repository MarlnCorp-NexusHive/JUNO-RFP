/* ---------- Charts ---------- */
function donutSVG(parts,center,sub){const tot=parts.reduce((s,p)=>s+p.v,0)||1;const r=62,c=2*Math.PI*r;let acc=0;
  const arcs=parts.filter(p=>p.v).map(p=>{const len=p.v/tot*c;const s=`<circle r="${r}" cx="90" cy="90" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"><title>${esc(p.l)}: ${p.v}</title></circle>`;acc+=len;return s}).join('');
  return `<div class="donut"><svg viewBox="0 0 180 180" width="170" height="170" role="img" aria-label="${esc(parts.map(p=>p.l+' '+p.v).join(', '))}"><circle r="${r}" cx="90" cy="90" fill="none" stroke="var(--line-2)" stroke-width="22"/>${arcs}<text x="90" y="88" text-anchor="middle" style="font:700 26px var(--f);fill:var(--ink)">${center}</text><text x="90" y="108" text-anchor="middle" style="font:500 11px var(--f);fill:var(--muted)">${sub}</text></svg>
  <div class="dleg">${parts.map(p=>`<div><i style="background:${p.c}"></i><span>${esc(p.l)}</span><b class="tnum">${p.v}</b><small class="tnum">${Math.round(p.v/tot*100)}%</small></div>`).join('')}</div></div>`}
function hstackSVG(rows,keys,cols,labels){const mx=Math.max(1,...rows.map(r=>keys.reduce((s,k)=>s+(r.v[k]||0),0)));
  return `<div class="hstack">${rows.map(r=>{const tot=keys.reduce((s,k)=>s+(r.v[k]||0),0);return `<div class="hs-row"><span class="hs-l">${r.h||''}${esc(r.l)}</span><div class="hs-bar">${keys.map((k,i)=>r.v[k]?`<i style="width:${r.v[k]/mx*100}%;background:${cols[i]}" title="${esc(labels[i])}: ${r.v[k]}"></i>`:'').join('')}</div><b class="tnum">${tot}</b></div>`}).join('')}</div>
  <div class="legend">${keys.map((k,i)=>`<span><i style="background:${cols[i]}"></i>${esc(labels[i])}</span>`).join('')}</div>`}
function barsSVG(cats,series,opt={}){const W=opt.W||600,H=opt.H||240,L=46,R=12,T=14,B=38,iw=W-L-R,ih=H-T-B;const raw=Math.max(1,...series.flatMap(s=>s.v));const step=opt.fmt?raw*1.12/4:Math.max(1,Math.ceil(raw*1.12/4));const mx=opt.fmt?raw*1.12:step*4;const y=v=>T+ih-v/mx*ih;const bw=iw/cats.length;const gw=bw*.72/series.length;
  let g='';for(let i=0;i<=4;i++){const v=step*i;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`}
  const bars=cats.map((c,i)=>series.map((s,j)=>{const x=L+i*bw+bw*.14+j*gw;return `<rect x="${x}" y="${y(s.v[i])}" width="${gw-2}" height="${Math.max(0,T+ih-y(s.v[i]))}" rx="3" fill="${s.c}"><title>${esc(c)} · ${esc(s.l)}: ${opt.fmt?opt.fmt(s.v[i]):s.v[i]}</title></rect>`}).join('')+`<text x="${L+i*bw+bw/2}" y="${H-14}" text-anchor="middle" class="ax" ${opt.hl===i?'style="font-weight:700;fill:var(--ink)"':''}>${esc(c)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||'Bar chart')}">${g}${bars}${opt.line?`<path d="${opt.line.v.map((v,i)=>(i?'L':'M')+(L+i*bw+bw/2)+' '+y(v)).join(' ')}" fill="none" stroke="${opt.line.c}" stroke-width="2.5"/>${opt.line.v.map((v,i)=>`<circle cx="${L+i*bw+bw/2}" cy="${y(v)}" r="3.5" fill="${opt.line.c}"/>`).join('')}`:''}</svg>
  <div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.l)}</span>`).join('')}${opt.line?`<span><i style="background:${opt.line.c};height:3px"></i>${esc(opt.line.l)}</span>`:''}</div>`}
function statusParts(list){return STATUSES.map(([k,l])=>({l,v:list.filter(t=>t.status===k).length,c:`var(--s-${k})`}))}
function weekly(){const s0=addD(TODAY,-((parse(TODAY).getDay()+6)%7)-7*7);const cats=[],due=[],done=[],late_=[];for(let w=0;w<12;w++){const a=addD(s0,w*7),b=addD(a,6);const wt=tasks.filter(t=>t.due>=a&&t.due<=b);cats.push(fmt(a));due.push(wt.length);done.push(wt.filter(t=>t.status==='done').length);late_.push(wt.filter(t=>t.status!=='done'&&t.due<TODAY).length)}return {cats,due,done,late_,hl:7}}
function roadmapSVG(w){const opt_W=()=>w||720;const s0=PROJECTS.reduce((m,p)=>p.start<m?p.start:m,PROJECTS[0].start),e0=PROJECTS.reduce((m,p)=>p.end>m?p.end:m,PROJECTS[0].end);const W=opt_W(),L=190,R=14,rh=34,T=26,H=T+PROJECTS.length*rh+24,iw=W-L-R,span=diff(s0,e0)||1;const x=d=>L+diff(s0,d)/span*iw;
  let ax='';const d0=parse(s0);for(let yy=d0.getFullYear();yy<=parse(e0).getFullYear()+1;yy++)['01','07'].forEach(mm=>{const d=yy+'-'+mm+'-01';if(d>=s0&&d<=e0)ax+=`<line x1="${x(d)}" x2="${x(d)}" y1="${T-6}" y2="${H}" stroke="var(--line-2)"/><text x="${x(d)}" y="${T-10}" text-anchor="middle" class="ax">${MN[+mm-1]} ${yy}</text>`});
  const bars=PROJECTS.map((p,i)=>{const m=M(p);const y=T+i*rh+6;const w=x(p.end)-x(p.start);return `<text x="8" y="${y+15}" style="font:500 12px var(--f);fill:var(--ink)">${esc(p.name.length>24?p.name.slice(0,23)+'…':p.name)}</text><rect x="${x(p.start)}" y="${y}" width="${Math.max(4,w)}" height="20" rx="6" fill="${p.color}" fill-opacity=".28"/><rect x="${x(p.start)}" y="${y}" width="${Math.max(4,w*m.done/100)}" height="20" rx="6" fill="${p.color}"><title>${esc(p.name)}: ${m.done}% done</title></rect><text x="${x(p.start)+6}" y="${y+14}" style="font:600 10.5px var(--fm);fill:#fff">${m.done}%</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Portfolio roadmap by project">${ax}${bars}<line x1="${x(TODAY)}" x2="${x(TODAY)}"  y1="${T-6}" y2="${H-16}" stroke="var(--crit)" stroke-width="2"/><text x="${x(TODAY)}" y="${H-3}" text-anchor="middle" style="font:600 10px var(--fm);fill:var(--crit)">Today</text></svg>`}
function vReports(){const open=tasks.filter(t=>t.status!=='done');const wk=weekly();

   <section class="card-box"><div class="panel-h"><div><h2 class="sec-title">Workload by person</h2><p class="sub">Tasks per owner, split by status</p></div></div><div style="padding:14px 16px">${hstackSVG(ppl,STATUSES.map(s=>s[0]),STATUSES.map(s=>`var(--s-${s[0]})`),STATUSES.map(s=>s[1]))}</div></section>

/* ---------- Agile: sprints, velocity, burndown, flow ---------- */
const ptsOf=t=>t.pts!=null?+t.pts:(+t.est||0)<=2?1:t.est<=4?2:t.est<=8?3:t.est<=12?5:t.est<=20?8:13;
const SPR=(()=>{const d=parse(TODAY);const mon=addD(TODAY,-((d.getDay()+6)%7));const cs=addD(mon,-7);return {cs,ce:addD(cs,13),n:14}})();
const workdays=(a,b)=>{let n=0,d=a;while(d<=b){const w=parse(d).getDay();if(w%6)n++;d=addD(d,1)}return n};
const VHIST={p1:[[24,20],[22,22],[26,21],[24,24],[28,25],[26,27]],p5:[[8,6],[10,9],[12,11],[13,12],[14,14],[15,13]],p2:[[12,10],[12,12],[14,11],[12,12],[13,13],[14,12]],p3:[[8,8],[9,8],[8,8],[10,9],[9,9],[8,8]],p4:[[10,7],[10,6],[9,6],[10,7],[8,6],[9,5]]};
const sprintTasks=pid=>tasks.filter(t=>t.p===pid&&t.due>=SPR.cs&&t.start<=SPR.ce);
function AG(p){const st=sprintTasks(p.id);const committed=st.reduce((s,t)=>s+ptsOf(t),0);const done=st.filter(t=>t.status==='done').reduce((s,t)=>s+ptsOf(t),0);
  const hist=VHIST[p.id]||[];const last3=hist.slice(-3);const avg=last3.length?Math.round(last3.reduce((s,h)=>s+h[1],0)/last3.length):0;
  const pred=last3.length?Math.round(last3.reduce((s,h)=>s+h[1]/h[0],0)/last3.length*100):0;
  const all=tasks.filter(t=>t.p===p.id);const backlogPts=all.filter(t=>t.status!=='done').reduce((s,t)=>s+ptsOf(t),0);
  const sprintsLeft=avg?Math.max(1,Math.ceil((backlogPts-(committed-done))/avg)+1):0;const finish=avg?addD(SPR.ce,(sprintsLeft-1)*14):null;
  const dn=all.filter(t=>t.status==='done');const cycle=dn.length?Math.round(dn.reduce((s,t)=>s+diff(t.start,t.due)+1,0)/dn.length):0;
  const wip=all.filter(t=>t.status==='doing').length;
  const elapsed=Math.min(10,workdays(SPR.cs,TODAY));
  return {st,committed,done,remaining:committed-done,hist,avg,pred,backlogPts,sprintsLeft,finish,cycle,wip,elapsed}}
function burnSVG(a){const W=560,H=230,L=40,R=30,T=14,B=34,iw=W-L-R,ih=H-T-B;const mx=Math.max(1,a.committed);const x=d=>L+d/10*iw,y=v=>T+ih-v/mx*ih;
  let g='';for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`}
  for(let d=0;d<=10;d+=2)g+=`<text x="${x(d)}" y="${H-12}" text-anchor="middle" class="ax">Day ${d}</text>`;
  let act='';for(let d=0;d<=a.elapsed;d++){const v=a.committed-a.done*Math.pow(d/Math.max(1,a.elapsed),1.4);act+=(d?'L':'M')+x(d).toFixed(1)+' '+y(v).toFixed(1)}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint burndown: ${a.remaining} of ${a.committed} points remaining on day ${a.elapsed} of 10">${g}
  <path d="M${x(0)} ${y(a.committed)} L${x(10)} ${y(0)}" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="${act}" stroke="var(--pine)" stroke-width="2.5" fill="none"/><circle cx="${x(a.elapsed)}" cy="${y(a.remaining)}" r="5" fill="var(--pine)"/>
  <text x="${a.elapsed>6?x(a.elapsed)-8:x(a.elapsed)+8}" text-anchor="${a.elapsed>6?'end':'start'}" y="${y(a.remaining)-10}" style="font:600 12px var(--f);fill:var(--ink)">${a.remaining} pts left</text></svg>
  <div class="legend"><span><i style="background:var(--faint)"></i>Ideal</span><span><i style="background:var(--pine)"></i>Remaining story points</span></div>`}
function velSVG(a){const data=[...a.hist.map((h,i)=>({l:'S'+(SPR.n-6+i),c:h[0],d:h[1]})),{l:'S'+SPR.n,c:a.committed,d:a.done,cur:true}];const W=560,H=230,L=36,R=14,T=14,B=34,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(...data.map(x=>Math.max(x.c,x.d)),1)*1.15;const y=v=>T+ih-v/mx*ih;const bw=iw/data.length;
  let g='';for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`}
  const bars=data.map((x,i)=>{const cx=L+i*bw+bw/2;return `<rect x="${cx-bw*.34}" y="${y(x.c)}" width="${bw*.32}" height="${ih-(y(x.c)-T)}" rx="3" fill="var(--lime-2)" stroke="var(--line)"/><rect x="${cx+bw*.02}" y="${y(x.d)}" width="${bw*.32}" height="${ih-(y(x.d)-T)}" rx="3" fill="${x.cur?'url(#hatch)':'var(--pine)'}" stroke="${x.cur?'var(--pine)':'none'}"/><text x="${cx}" y="${H-12}" text-anchor="middle" class="ax" style="${x.cur?'font-weight:700;fill:var(--ink)':''}">${x.l}${x.cur?' (now)':''}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Velocity: committed versus completed story points for the last 7 sprints; average ${a.avg}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--lime-3)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--pine)" stroke-width="2"/></pattern></defs>${g}${bars}
  <line x1="${L}" x2="${W-R}" y1="${y(a.avg)}" y2="${y(a.avg)}" stroke="var(--p-high)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-R}" y="${y(a.avg)-6}" text-anchor="end" style="font:600 11px var(--fm);fill:var(--p-high)">avg ${a.avg}</text></svg>
  <div class="legend"><span><i style="background:var(--lime-2);border:1px solid var(--line)"></i>Committed</span><span><i style="background:var(--pine)"></i>Completed</span><span><i style="background:transparent;border-top:2px dashed var(--p-high);height:0"></i>3-sprint average</span></div>`}
function cfdSVG(pid){const all=tasks.filter(t=>t.p===pid);const live={};STATUSES.forEach(([k])=>live[k]=all.filter(t=>t.status===k).reduce((s,t)=>s+ptsOf(t),0));const tot=Object.values(live).reduce((a,b)=>a+b,0)||1;
  const weeks=6,snaps=[];for(let w=0;w<weeks;w++){const f=w/(weeks-1);if(w===weeks-1){snaps.push(live);continue}const done=Math.round(live.done*(.3+.7*f)),review=Math.round(live.review*(.5+.5*f)),doing=Math.round(live.doing*(.7+.3*f)),todo=Math.round(live.todo*(1.15-.15*f));snaps.push({done,review,doing,todo,backlog:Math.max(0,tot-done-review-doing-todo)})}
  const W=560,H=230,L=36,R=14,T=14,B=34,iw=W-L-R,ih=H-T-B;const x=i=>L+i/(weeks-1)*iw,y=v=>T+ih-v/tot*ih;const order=['done','review','doing','todo','backlog'];
  let paths='';order.forEach((k,ki)=>{const lo=i=>order.slice(0,ki).reduce((s,kk)=>s+snaps[i][kk],0),hi=i=>lo(i)+snaps[i][k];let d='';for(let i=0;i<weeks;i++)d+=(i?'L':'M')+x(i)+' '+y(hi(i));for(let i=weeks-1;i>=0;i--)d+='L'+x(i)+' '+y(lo(i));paths+=`<path d="${d}Z" fill="var(--s-${k})" fill-opacity="${k==='backlog'?.25:.75}"/>`});
  let ax='';for(let i=0;i<weeks;i++)ax+=`<text x="${x(i)}" y="${H-12}" text-anchor="${i===weeks-1?'end':i===0?'start':'middle'}" class="ax">${i===weeks-1?'This week':fmt(addD(TODAY,-(weeks-1-i)*7))}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative flow of story points by status over 6 weeks">${paths}${ax}<text x="${L-6}" y="${T+8}" text-anchor="end" class="ax">${tot}</text><text x="${L-6}" y="${T+ih}" text-anchor="end" class="ax">0</text></svg>
  <div class="legend">${order.map(k=>`<span><i style="background:var(--s-${k});opacity:${k==='backlog'?.4:.85}"></i>${SL[k]}</span>`).join('')}</div>`}
function vAgile(){const p=PJ[S.pid],a=AG(p);const goal=(goals[p.id]!=null?goals[p.id]:p.id==='p1'?'Close Q3 reporting and finish coach hiring so cohort 4 can start on time.':p.id==='p5'?'Finish the narrative, budget and letters so red team can review.':'');
  const plan=tasks.filter(t=>t.p===p.id&&(t.status==='backlog'||t.status==='todo')&&t.start>SPR.ce).sort((x,y)=>PORDER[x.pri]-PORDER[y.pri]||(x.due<y.due?-1:1));let cap=0;const pick=[];plan.forEach(t=>{if(cap+ptsOf(t)<=a.avg){pick.push(t);cap+=ptsOf(t)}});
  const R=retro[p.id]||{good:[],imp:[],act:[]};
  return `<div class="sprint-h card-box"><div style="flex:1;min-width:260px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 class="sec-title" style="font-size:18px">Sprint ${SPR.n}</h2><span class="pill info np">${fmt(SPR.cs)} – ${fmt(SPR.ce)}</span><span class="sub">Day ${a.elapsed} of 10</span>${a.avg&&a.committed>a.avg*1.2?`<span class="pill crit np">Over-committed by ${Math.round((a.committed/a.avg-1)*100)}%</span><button class="btn sm ai" data-act="ask" data-q="Sprint ${SPR.n} for ${esc(p.name)} has ${a.committed} story points committed but our 3-sprint velocity is ${a.avg}. Which tasks should move to the next sprint or be split? Consider priority, dependencies and due dates.">${svg('i-spark')}Rebalance</button>`:''}</div>
   <label for="goalIn" class="sub" style="display:block;margin-top:10px">Sprint goal</label><input id="goalIn" class="goal-in" value="${esc(goal)}" placeholder="What must this sprint achieve?"></div>

  <div class="two" style="margin-top:16px">

  </div>
  <div class="two" style="margin-top:16px">

    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${pick.length?`<button class="btn dark sm" data-act="commitplan" data-id="${pick.map(t=>t.id).join(',')}">Commit plan</button>`:''}<button class="btn sm ai" data-act="ask" data-q="Plan Sprint ${SPR.n+1} for ${esc(p.name)}. Our 3-sprint average velocity is ${a.avg} story points and predictability is ${a.pred}%. Pick tasks by priority and dependencies, explain the sprint goal in one line, and flag anything that should be split.">${svg('i-spark')}Plan with Copilot</button></div></div></section>
  </div>

   <div class="retro">${[['good','Went well'],['imp','To improve'],['act','Action items']].map(([k,l])=>`<div><b>${l}</b>${(R[k]||[]).map(x=>`<div class="retro-n">${esc(x)}</div>`).join('')}<input class="retro-in" data-retro="${k}" placeholder="Add a note, then Enter" aria-label="Add ${l} note"></div>`).join('')}</div></section>`;

async function breakdown(){const t=byId(S.drawer);if(!t)return;if(!sample){toast('AI breakdown needs Claude. Copilot is not configured on this site.');return}

    case 'bShift':if(el.value){const n=+el.value;S.sel.forEach(id=>{const t=byId(id);if(t){t.start=addD(t.start,n);t.due=addD(t.due,n)}});save();toast('Shifted '+S.sel.size+' tasks');render()}break;
    case 'gateSel':S.gate=el.value;S.gateRan='';render();break;
    case 'addDep':if(el.value){byId(S.drawer).deps.push(el.value);save();render()}break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='updTxt'){S.updDraft=e.target.value;return}if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('q');if(i){i.focus();i.setSelectionRange(pos,pos)}}if(e.target.id==='palIn')palRender(e.target.value)});
document.addEventListener('focusout',e=>{if(e.target.id==='goalIn'){goals[S.pid]=e.target.value.trim();save()}if(e.target.id==='drTitle'){const v=e.target.value.trim();if(v&&S.drawer&&byId(S.drawer).title!==v)update(S.drawer,{title:v})}if(e.target.id==='addIn'&&!e.target.value.trim()){S.adding=null;setTimeout(render,0)}});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}
  if(e.key==='Escape'){if(document.getElementById('pal').classList.contains('on'))closePal();else if(S.drawer)closeDrawer();else if(S.cp)toggleCP(false);return}
  const t=e.target;
  if(t.id==='fq'&&e.key==='Enter'){S.find.q=t.value;render();setTimeout(()=>{const i=document.getElementById('fq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},10);return}
  if(t.id==='libq'&&e.key==='Enter'){S.libq=t.value;render();return}
  if(t.id==='cNew'&&e.key==='Enter'){const v=t.value.trim();if(!v)return;const pr=pursuits.find(x=>x.id===S.prs);pr.comments.push({id:'c'+Date.now().toString(36),sec:t.dataset.sec,by:ME,text:v,at:TODAY,res:false,rep:[]});const ms=[...v.matchAll(/@(\w+)/g)].map(m=>m[1].toLowerCase()).filter(k=>PEOPLE[k]);if(ms.length)notifyMsg(ms,PEOPLE[ME].n.split(' ')[0]+' mentioned you on '+(pr.secs.find(x=>x.id===t.dataset.sec)||{}).title+': '+v.slice(0,90));save();render();if(ms.length)toast('Comment added. '+ms.map(k=>PEOPLE[k].n.split(' ')[0]).join(', ')+' notified');return}
  if(t.classList&&t.classList.contains('creply')&&e.key==='Enter'){const v=t.value.trim();if(!v)return;const pr=pursuits.find(x=>x.id===S.prs);const c=pr.comments.find(x=>x.id===t.dataset.cid);c.rep.push({by:ME,text:v,at:TODAY});const ms=[...v.matchAll(/@(\w+)/g)].map(m=>m[1].toLowerCase()).filter(k=>PEOPLE[k]);notifyMsg([c.by,...ms].filter(k=>k!==ME),PEOPLE[ME].n.split(' ')[0]+' replied: '+v.slice(0,90));save();render();return}
  if(t.id==='palIn'){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(0,Math.min(palItems.length-1,palIdx+(e.key==='ArrowDown'?1:-1)));document.querySelectorAll('[data-pal]').forEach((b,i)=>b.classList.toggle('act',i===palIdx))}if(e.key==='Enter'){const it=palItems[palIdx];closePal();it&&it.f()}return}
  if(t.id==='addIn'&&e.key==='Enter'){const v=t.value.trim();if(v){const p=S.route==='project'?S.pid:'p1';tasks.push({id:nextId(),p,title:v,status:t.dataset.col,owner:S.owner||ME,pri:'med',start:TODAY,due:off(7),est:4,clause:'—',line:'—',deps:[],sub:[],comments:[]});save();toast('Task added')}S.adding=t.dataset.col;render();setTimeout(()=>{const i=document.getElementById('addIn');i&&i.focus()},10);return}
  if(t.id==='subIn'&&e.key==='Enter'){const v=t.value.trim();if(v){byId(S.drawer).sub.push({t:v,d:false});save();render();setTimeout(()=>{const i=document.getElementById('subIn');i&&i.focus()},10)}return}
  if(t.id==='drTitle'&&e.key==='Enter'){t.blur();return}
  if(t.id==='goalIn'&&e.key==='Enter'){t.blur();toast('Sprint goal saved');return}
  if(t.classList&&t.classList.contains('retro-in')&&e.key==='Enter'){const v=t.value.trim();if(v){const k=t.dataset.retro;const r=retro[S.pid]||(retro[S.pid]={good:[],imp:[],act:[]});(r[k]||(r[k]=[])).push(v);save();render();setTimeout(()=>{const i=document.querySelector('.retro-in[data-retro="'+k+'"]');i&&i.focus()},10)}return}
  if(t.id==='cpTxt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=t.value.trim();if(v){t.value='';ask(v)}return}
  if(t.classList&&t.classList.contains('card')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDrawer(t.dataset.id)}
});
document.addEventListener('submit',e=>{if(e.target.id==='cpForm'){e.preventDefault();const i=document.getElementById('cpTxt');const v=i.value.trim();if(v){i.value='';ask(v)}}});

/* ---------- Drag: board + calendar ---------- */
let dragId=null,justDragged=false;
let pDrag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-pcard]');if(c){pDrag=c.dataset.pcard;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',pDrag)}catch(_){}}});
document.addEventListener('dragover',e=>{if(!pDrag)return;const z=e.target.closest('[data-pcol]');if(!z)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{if(!pDrag)return;const z=e.target.closest('[data-pcol]');const id=pDrag;pDrag=null;if(!z)return;e.preventDefault();const g=pipe.find(x=>x.id===id);if(!g)return;const st=z.dataset.pcol;if(g.stage!==st){g.stage=st;if(st==='awarded'&&!g.awd)g.awd=g.req;save();render();toast(g.name+' moved to '+STL[st]+(st==='awarded'&&!g.pid?'. Create the project from the award letter next.':''))}else render()});
document.addEventListener('dragend',()=>{if(pDrag){pDrag=null;render()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-card]');if(!c)return;dragId=c.dataset.card;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('[data-card]');c&&c.classList.remove('dragging');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));justDragged=true;setTimeout(()=>justDragged=false,50)});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-col],[data-day]');if(!z||!dragId)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-col],[data-day]');if(!z||!dragId)return;e.preventDefault();const t=byId(dragId);
  if(z.dataset.col&&t.status!==z.dataset.col){update(t.id,{status:z.dataset.col});toast('“'+t.title+'” moved to '+SL[z.dataset.col])}
  if(z.dataset.day&&t.due!==z.dataset.day){const n=diff(t.due,z.dataset.day);update(t.id,{due:z.dataset.day,start:addD(t.start,n)});toast('Rescheduled to '+fmtL(z.dataset.day))}
  dragId=null});

/* ---------- Drag: Gantt ---------- */
let gd=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-gbar]');if(!b||e.button!==0)return;const t=byId(b.dataset.gbar);gd={id:t.id,el:b,x:e.clientX,mode:e.target.classList.contains('gh')?'resize':'move',l:parseFloat(b.style.left),w:parseFloat(b.style.width)||0,moved:false};b.setPointerCapture(e.pointerId);b.classList.add('dragging')});
document.addEventListener('pointermove',e=>{if(!gd)return;const dx=e.clientX-gd.x;if(Math.abs(dx)>3)gd.moved=true;const dd=Math.round(dx/G.w);if(gd.mode==='move')gd.el.style.left=(gd.l+dd*G.w)+'px';else gd.el.style.width=Math.max(G.w,gd.w+dd*G.w)+'px';gd.dd=dd});
document.addEventListener('pointerup',e=>{if(!gd)return;const g=gd;gd=null;g.el.classList.remove('dragging');if(!g.moved){openDrawer(g.id);return}const t=byId(g.id);const dd=g.dd||0;if(dd){if(g.mode==='move'){update(t.id,{start:addD(t.start,dd),due:addD(t.due,dd)});toast('“'+t.title+'” moved '+(dd>0?'+':'')+dd+' day'+(Math.abs(dd)>1?'s':''))}else{const nd=addD(t.due,dd);update(t.id,{due:nd<t.start?t.start:nd});toast('Due date set to '+fmtL(byId(t.id).due))}}else render()});

/* ---------- Start ---------- */
if(S.route==='project'&&!PJ[S.pid])S.route='home';
if(S.route==='intake')S.route='pipeline';if(S.route==='rxintake')S.route='pursuits';if(S.route==='pursuit'&&!pursuits.find(x=>x.id===S.prs))S.route='pursuits';
autoNotify();render();renderCP();
})();
</script>

</body>
